spring.application.name=ttobagi-server

# 로그인은 JWT로 하므로 Spring Security 기본 계정(실행마다 비밀번호 생성)은 만들지 않는다
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# 실행 프로파일: 지정이 없으면 local, 배포 서버는 SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

# DB 연결 정보
spring.datasource.url=${TTOBAGI_DB_URL}
spring.datasource.username=${TTOBAGI_DB_USERNAME}
spring.datasource.password=${TTOBAGI_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# AI
ai.server.url=${TTOBAGI_AI_SERVER}
# BE → AI 요청에 붙이는 토큰, AI → BE 콜백에서 확인하는 토큰 (AI 서버와 같은 값을 쓴다)
ai.api-token=${TTOBAGI_AI_API_TOKEN}
ai.callback-token=${TTOBAGI_CALLBACK_TOKEN}
# 새 분석의 군집화·FAQ 대상 (IMPROVEMENT: 미답변+오답변, UNANSWER_ONLY, ALL), 잘못된 값이면 서버가 뜨지 않는다
ai.analysis.default-mode=${TTOBAGI_ANALYSIS_DEFAULT_MODE:IMPROVEMENT}

# 업로드 원본 보관 (NCP Object Storage, S3 호환)
# 꺼져 있으면(기본) 원본을 보관하지 않고 나머지 기능은 그대로 동작한다
storage.enabled=${TTOBAGI_STORAGE_ENABLED:false}
storage.endpoint=${TTOBAGI_STORAGE_ENDPOINT:https://kr.object.ncloudstorage.com}
storage.region=${TTOBAGI_STORAGE_REGION:kr-standard}
storage.access-key=${TTOBAGI_STORAGE_ACCESS_KEY:}
storage.secret-key=${TTOBAGI_STORAGE_SECRET_KEY:}
storage.upload-bucket=${TTOBAGI_STORAGE_UPLOAD_BUCKET:breathai-uploads}

# JPA 설정
# 스키마는 Flyway가 관리하고 JPA는 엔티티와 일치하는지만 검증한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway 설정
# 이미 테이블이 있는 DB에도 적용되도록 이력 테이블만 만들고 V1부터 실행한다
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 파일 업로드 제한
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Email 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 시스템 관리자 코드
system.admin-code=${SYSTEM_ADMIN_CODE}

# 공사 메일 외에 가입·로그인을 허용할 주소 (쉼표 구분, 비우면 공사 메일만)
auth.extra-allowed-emails=${TTOBAGI_EXTRA_ALLOWED_EMAILS:}

# 주소
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Swagger 외부 설정
swagger.contact-name=${SWAGGER_CONTACT_NAME}
swagger.contact-email=${SWAGGER_CONTACT_EMAIL}
swagger.production-url=${SWAGGER_PRODUCTION_URL}

# 헬스체크
# 외부에는 /actuator/health만 공개한다
management.endpoints.web.exposure.include=health
# 메일 서버 상태 때문에 서버 전체가 DOWN으로 나오지 않게 메일 검사는 끈다
management.health.mail.enabled=false
