# 테스트 전용 설정
# 사용 중인 DB(.env) 대신 테스트마다 도커로 띄운 빈 MariaDB를 쓴다
# 비밀값은 모두 테스트용 가짜 값이다

# Testcontainers JDBC 주소: 첫 연결 때 MariaDB 11.4(배포와 같은 버전) 컨테이너를 띄우고 테스트가 끝날 때까지 유지한다
spring.datasource.url=jdbc:tc:mariadb:11.4:///ttobagi_db?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
TTOBAGI_DB_URL=${spring.datasource.url}
TTOBAGI_DB_USERNAME=test
TTOBAGI_DB_PASSWORD=test

# Flyway 마이그레이션 + 테스트 전용 스키마(AI 소유 bronze 테이블 최소 복사본)
spring.flyway.locations=classpath:db/migration,classpath:db/testdata

# 외부로 나가지 않는 주소와 가짜 키
TTOBAGI_AI_SERVER=http://127.0.0.1:1
TTOBAGI_AI_API_TOKEN=test-ai-api-token
TTOBAGI_CALLBACK_TOKEN=test-callback-token
JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
MAIL_USERNAME=test@example.com
MAIL_PASSWORD=test
spring.mail.host=127.0.0.1
spring.mail.port=2525
SYSTEM_ADMIN_CODE=test-admin-code
CORS_ALLOWED_ORIGINS=http://localhost:5173
SWAGGER_CONTACT_NAME=test
SWAGGER_CONTACT_EMAIL=test@example.com
SWAGGER_PRODUCTION_URL=http://localhost
# 공사 메일 외 허용 주소 (AllowedEmailIntegrationTest)
TTOBAGI_EXTRA_ALLOWED_EMAILS=guest@example.com, Prof@Example.org
